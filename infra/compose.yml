services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langai}
      POSTGRES_USER: ${POSTGRES_USER:-langai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langai} -d ${POSTGRES_DB:-langai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    environment:
      LANGAI_ENV: ${LANGAI_ENV:-development}
      LANGAI_BIND: 0.0.0.0:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-langai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langai}
      RUST_LOG: ${RUST_LOG:-langai_server=info,tower_http=info}
      SESSION_PEPPER: ${SESSION_PEPPER}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      AUDIO_STORAGE_PATH: /var/lib/langai/audio
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-26214400}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - audio-data:/var/lib/langai/audio

volumes:
  audio-data:
  postgres-data:
